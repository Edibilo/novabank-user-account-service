spring.application.name=novabank-user-account-service
#port
server.port=8081

#database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/novabank_user_account

spring.datasource.username=postgres
spring.datasource.password=1234

#Changes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true

#jwt
app.jwt-secret=uh90h6h8u477hu673hggh4jr9rujhr876wghhehesjj374ndjjd89j234nhdh4977duddj
app.expiration-milliseconds=86400000

#Actuator
management.endpoints.web.exposure.include=*

#eureka discovery config
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true

#kafka config
spring.kafka.bootstrap-servers=localhost:9092

#kafka as producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.spring.json.add.type=true
